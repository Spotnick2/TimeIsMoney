name: Package check

# `check` is a dry run. -d is the real no-upload switch: merely leaving
# CF_API_KEY out still lets the packager cut a GitHub release - with the WHOLE
# CHANGELOG.md as its notes. CurseForge keeps building releases with its own
# packager from the tag webhook.
#
# On a tag, once `check` has passed, the zip it built and checked is published
# twice more, never rebuilt: `release` makes the GitHub Release (with
# release.json), `wago` uploads to Wago Addons. The packager stays out of both.
# From the shared templates: References\Docs\release (RELEASING.md section 2).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish an existing tag again where it failed. Run it from main: `check`
  # builds the tag's tree, notes included. A manual run also runs the full
  # reference parity suite on that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.2.0)
        required: true
      publish:
        description: Where to publish it
        type: choice
        options: [both, github, wago]
        default: both
permissions:
  contents: read
env:
  ADDON: TimeIsMoney
# One run per pull request: a newer commit cancels the superseded run, so the
# single self-hosted Windows runner never works through outdated commits. Pushes
# to main, tags and manual runs get a group per ref and commit (a tag and main
# share a commit) and are never cancelled.
concurrency:
  group: package-check-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty except on a manual run, so checkout keeps its default: the
          # commit that triggered the run (a branch ref would build its tip).
          ref: ${{ inputs.tag }}
      - name: Verify original design bytes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for entry in json.loads(Path("docs/originals.json").read_text())["files"]:
              data = Path(entry["path"]).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              assert len(data) == entry["size"] and actual == entry["git_blob_sha"], entry["path"]
          print("design: all four original files match their source byte sizes and Git blob hashes")
          PY
      - name: Check pinned reference tooling and evidence
        run: python3 -m unittest discover -s tests -p test_paperclips_reference.py -v
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Syntax-check Lua and run tests
        run: |
          set -euo pipefail
          test "$(lua5.1 -e 'print(_VERSION)')" = 'Lua 5.1'
          mapfile -d '' files < <(find . -name '*.lua' -not -path './.git/*' -print0)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do luac5.1 -p "$f"; done
          for f in tests/test_*.lua; do lua5.1 "$f"; done
      - name: Parse PowerShell tooling
        shell: pwsh
        run: |
          Get-ChildItem Tools, tests -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      # On a manual run GITHUB_REF is main, and the packager names the build
      # after whichever tag at HEAD it sorts first (release.sh 613-628 prefers
      # GITHUB_REF_NAME only on a tag push). An alpha promoted to a release
      # without a code change puts two tags on one commit, so drop the others
      # from this checkout: the zip and its TOC version are the requested tag's.
      - name: Only the requested tag at HEAD
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git tag --points-at HEAD)" = "$TAG" || { echo "$TAG is not at HEAD"; exit 1; }
      - name: Package dry run
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d
      # check_package.py reads the TOC, whose first line is the embedded LibGlass XML:
      # fetch the library at the ref .pkgmeta pins (after the packager, which fetches
      # its own copy, and after the Lua checks, which cover this repo only).
      - name: Fetch the pinned LibGlass for the package check
        run: |
          set -euo pipefail
          ref=$(python3 -c "import re,pathlib; print(re.search(r'Spotnick2/LibGlass\s+(?:tag|commit): (\S+)', pathlib.Path('.pkgmeta').read_text()).group(1))")
          git clone --quiet https://github.com/Spotnick2/LibGlass Libs/LibGlass-1.0
          git -C Libs/LibGlass-1.0 checkout --quiet "$ref"
          echo "LibGlass at $ref ($(git -C Libs/LibGlass-1.0 rev-parse --short HEAD))"
      - name: Verify exact package contents and version
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(.release/*.zip)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do python3 Tools/check_package.py "$archive"; done
      # What a tag publishes next to the zip, from the tag's own CHANGELOG.md,
      # built on every run so a changelog heading or TOC field that breaks it
      # fails on the pull request. Off a tag there is no tag section, so it
      # reads the newest one. `release` and `wago` publish these very files.
      # The script is the workflow's own (GITHUB_SHA), not the checked-out
      # tree's: a manual run checks out the requested tag, and a tag from
      # before the script has none (Codex, NodeRadar #36).
      - name: The release notes and release.json build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          git show "$GITHUB_SHA:tests/release_files.sh" > "$RUNNER_TEMP/release_files.sh"
          bash "$RUNNER_TEMP/release_files.sh" "$tag" "$zip" "$RUNNER_TEMP/release-files"
      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default - without include-hidden-files the upload finds
      # nothing. `warn` then leaves the job green while publishing no artifact.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Keep the notes and release.json for the publishers
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error
  windows:
    # The owner's local runner (tim-local), started at logon as the owner's account,
    # so jobs use the installed Node 24, Python, Chrome and MSVC. Keeps the long
    # Windows job off the hosted-minutes budget; the short Linux job stays hosted.
    runs-on: [self-hosted, Windows, tim]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      # The reference parity suite (about 8 minutes) runs the pinned JavaScript
      # reference beside the Lua simulation. A pull request runs it only when it
      # changes what the suite tests or how it tests; pushes to main and manual
      # runs always run it.
      - name: Decide whether reference parity runs
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -ne 'pull_request') {
            "Full suite: ${{ github.event_name }} run."
            'parity=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $changed = @(git diff --name-only 'origin/${{ github.base_ref }}...HEAD')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the pull request changes.' }
          $pattern = '^(Sim/|Probe/|Tools/reference/|Tools/paperclips_reference\.py$|Tools/make_project_text\.py$|UI/ProjectText\.lua$|tests/reference/|docs/reference/|docs/plan/|\.github/workflows/)'
          $relevant = @($changed | Where-Object { $_ -match $pattern })
          if ($relevant.Count -gt 0) {
            "Full suite: the pull request changes"
            $relevant | ForEach-Object { "  $_" }
            'parity=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "Reference parity skipped: no simulation, probe, reference tooling, plan or workflow change."
            'parity=false' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Verify installed Node 24 reference profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^v24\.\d+\.\d+$') {
            throw "The measured profile requires Node 24; found '$version'."
          }
          "Node $version at $((Get-Command node).Source)"
      - name: Retrieve pinned reference developer inputs
        if: steps.scope.outputs.parity == 'true'
        shell: pwsh
        run: python Tools/paperclips_reference.py fetch
      - name: Check the generated project text against the plan and the reference
        if: steps.scope.outputs.parity == 'true'
        shell: pwsh
        run: python Tools/make_project_text.py --check
      - name: Compare reference adapter with installed Chromium
        if: steps.scope.outputs.parity == 'true'
        shell: pwsh
        run: node Tools/reference/check_browser.cjs
      - name: Build declared Lua 5.1 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'lua-5.1.5.tar.gz'
          Invoke-WebRequest 'https://www.lua.org/ftp/lua-5.1.5.tar.gz' -OutFile $archive
          # Official checksum: https://www.lua.org/ftp/
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333') {
            throw 'Lua source checksum mismatch.'
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Lua source extraction failed.' }
          $luaRoot = Join-Path $env:RUNNER_TEMP 'lua-5.1.5'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vsRoot) { throw 'Runner MSVC toolchain not found.' }
          $devCmd = Join-Path $vsRoot 'Common7/Tools/VsDevCmd.bat'
          $build = Join-Path $luaRoot 'build.cmd'
          @(
            '@echo off'
            ('call "' + $devCmd + '" -arch=x64')
            'if errorlevel 1 exit /b %errorlevel%'
            ('cd /d "' + (Join-Path $luaRoot 'src') + '"')
            'call ..\etc\luavs.bat'
            'if errorlevel 1 exit /b %errorlevel%'
          ) | Set-Content -LiteralPath $build -Encoding ascii
          & cmd.exe /d /c $build
          if ($LASTEXITCODE -ne 0) { throw 'Lua MSVC build failed.' }
          "TIM_LUA=$(Join-Path $luaRoot 'src/lua.exe')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test reference runner, first-divergence comparison and Lua workshop parity
        if: steps.scope.outputs.parity == 'true'
        shell: pwsh
        run: node --test tests/reference/runner.test.cjs tests/reference/divergence.test.cjs tests/reference/jsmath.test.cjs tests/reference/workshop.test.cjs tests/reference/probe.test.cjs tests/reference/cost_pow.test.cjs
      # The window test loads the real LibGlass and the deploy installs it: both use
      # a checkout at the ref .pkgmeta pins.
      - name: Fetch the pinned LibGlass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = [regex]::Match((Get-Content -Raw .pkgmeta), 'Spotnick2/LibGlass\s+(?:tag|commit): (\S+)').Groups[1].Value
          if (!$ref) { throw 'No LibGlass ref in .pkgmeta.' }
          $lib = Join-Path $env:RUNNER_TEMP 'LibGlass'
          if (Test-Path -LiteralPath $lib) { Remove-Item -LiteralPath $lib -Recurse -Force }
          git clone --quiet https://github.com/Spotnick2/LibGlass $lib
          if ($LASTEXITCODE) { throw 'LibGlass clone failed.' }
          git -C $lib checkout --quiet $ref
          if ($LASTEXITCODE) { throw "LibGlass ref $ref not found." }
          "LIBGLASS=$lib" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute Windows test runner
        shell: pwsh
        run: ./tests/run.ps1 -Lua $env:TIM_LUA
      - name: Execute deploy tooling in temporary AddOns folder
        shell: pwsh
        run: ./tests/test_deploy.ps1
  # A GitHub Release for every tag: the zip `check` built and checked,
  # release.json, and the tag's CHANGELOG.md section as the notes. The only job
  # allowed to write to the repository.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'wago')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Everything comes from `check`'s artifacts - the zip, and the notes and
      # release.json it built from the tag's tree - so there is no checkout:
      # on a manual run from main, one would read main's CHANGELOG.md.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          ls dist out
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The title is release.json's name: the packaged TOC's Title, colour
      # codes stripped.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${TAG,,}" in *alpha*|*beta*) pre=--prerelease ;; esac
          title="$(jq -r '.releases[0].name' out/release.json) ${TAG#v}"
          gh release create "$TAG" "$ZIP" out/release.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file out/notes.md $pre

  # The same zip on Wago Addons, through its upload API - the request the
  # packager's upload_wago makes, minus its two problems: it would package a
  # second, unchecked zip, and send the whole CHANGELOG.md as the changelog.
  # Only this job sees WAGO_API_TOKEN.
  wago:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # As in `release`: `check`'s artifacts only, no checkout.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The project is the packaged TOC's X-Wago-ID. Each interface becomes the
      # patch Wago names it by (16001 -> 1.60.1), which must be one Wago lists
      # for Forever: the packager would fall back to a neighbouring patch, but a
      # new client build Wago doesn't know yet should stop here instead. Run the
      # tag again (workflow_dispatch, wago) once Wago lists it.
      - name: The Wago upload metadata
        run: |
          id=$(unzip -p "$ZIP" "$ADDON/$ADDON.toc" | tr -d '\r' | sed -n 's/^## X-Wago-ID: *//p' | head -1)
          test -n "$id" || { echo "the packaged TOC has no X-Wago-ID"; exit 1; }
          echo "WAGO_ID=$id" >> "$GITHUB_ENV"
          known=$(curl -sS --fail --retry 3 https://addons.wago.io/api/data/game | jq -c '.patches.forever // []')
          echo "Wago's Forever patches: $known"
          patches=()
          for i in $(jq -r '.releases[0].metadata[].interface' out/release.json); do
            p=$(printf '%d.%d.%d' $((i / 10000)) $((i / 100 % 100)) $((i % 100)))
            jq -e --arg p "$p" 'index($p) != null' <<< "$known" > /dev/null ||
              { echo "Wago lists no Forever patch $p (interface $i)"; exit 1; }
            patches+=("$p")
          done
          case "${TAG,,}" in *alpha*) stability=alpha ;; *beta*) stability=beta ;; *) stability=stable ;; esac
          jq -n --arg label "$TAG" --arg stability "$stability" --rawfile changelog out/notes.md \
            --argjson patches "$(printf '%s\n' "${patches[@]}" | jq -R . | jq -s .)" \
            '{label: $label, stability: $stability, changelog: $changelog,
              supported_forever_patches: $patches}' > out/metadata.json
          cat out/metadata.json

      - name: Upload to Wago Addons
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          test -n "$WAGO_API_TOKEN" || { echo "the WAGO_API_TOKEN secret is not set"; exit 1; }
          code=$(curl -sS --retry 3 --retry-delay 10 -o out/result.json -w '%{http_code}' \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H 'accept: application/json' \
            -F 'metadata=<out/metadata.json' \
            -F "file=@$ZIP" \
            "https://addons.wago.io/api/projects/$WAGO_ID/version")
          echo "HTTP $code"
          case "$code" in
            200|201) echo "uploaded: https://addons.wago.io/addons/$WAGO_ID" ;;
            *) cat out/result.json 2>/dev/null; exit 1 ;;
          esac
